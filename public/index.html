<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="lanting — a multi-AI group chat for coding CLIs.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="lanting">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <title>lanting</title>
  </head>
  <body>
    <section id="login-view" class="login-view">
      <form id="token-form" class="login-card">
        <h1>lanting</h1>
        <p class="login-hint">登录后由浏览器安全保存登录状态</p>
        <label for="token-input">访问令牌</label>
        <input id="token-input" type="password" autocomplete="current-password" required>
        <button id="connect-button" class="primary" type="submit">连接</button>
        <p id="login-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>

    <div id="app-view" class="app-view" data-sidebar-collapsed="false" data-mobile-sidebar-open="false" hidden>
      <aside id="group-sidebar" class="group-sidebar" aria-label="群列表">
        <div class="sidebar-heading">
          <div class="sidebar-brand">
            <img class="sidebar-logo" src="/icon.svg" alt="">
            <strong>lanting</strong>
          </div>
          <div class="sidebar-heading-actions">
            <button id="settings-button" class="quiet small app-settings-button" type="button" aria-label="设置" title="设置" aria-haspopup="dialog" aria-controls="settings-dialog">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button id="collapse-sidebar-button" class="quiet small" type="button" aria-label="收起群列表">收起</button>
          </div>
        </div>
        <form id="create-form" class="create-form">
          <label>
            <span class="visually-hidden">工作目录</span>
            <select id="directory-select" aria-label="工作目录" required>
              <option value="">选择工作目录</option>
            </select>
          </label>
          <div id="member-picks" class="member-picks" role="group" aria-label="拉哪些 AI 进群"></div>
          <button id="create-button" type="submit" disabled>新建群</button>
          <p id="create-status" class="form-status" aria-live="polite"></p>
        </form>
        <label class="group-search">
          <span class="visually-hidden">搜索群会话</span>
          <input id="group-search-input" type="search" maxlength="256" placeholder="搜索群会话">
        </label>
        <div id="list-heading" class="list-heading">
          <strong id="list-title">最近群会话</strong>
          <button id="select-button" class="quiet small" type="button">选择</button>
        </div>
        <div id="selection-heading" class="selection-heading" hidden>
          <button id="cancel-selection-button" class="quiet small" type="button">取消</button>
          <button id="list-back-button" class="quiet small" type="button" hidden>← 最近群会话</button>
          <div class="selection-heading-end">
            <strong id="selection-count">已选择 0 项</strong>
            <button id="select-all-button" class="quiet small" type="button">全选</button>
          </div>
        </div>
        <div id="group-list" class="group-list" aria-live="polite">
          <p class="empty-hint">还没有群</p>
        </div>
        <p id="list-status" class="form-status list-status" aria-live="polite"></p>
        <nav id="list-destinations" class="list-destinations" aria-label="群会话分类">
          <button id="trash-view-button" class="quiet" type="button">回收站</button>
        </nav>
        <div id="bulk-actions" class="bulk-actions" hidden>
          <button id="bulk-restore-button" type="button" hidden>恢复</button>
          <button id="bulk-delete-button" class="danger" type="button">删除</button>
        </div>
      </aside>

      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭群列表" tabindex="-1"></button>

      <main id="group-pane" class="group-pane">
        <header class="group-header">
          <button id="open-sidebar-button" class="quiet sidebar-open-button" type="button" aria-label="打开群列表" aria-expanded="false">☰</button>
          <div class="group-heading">
            <div class="group-title-row">
              <strong id="group-title">lanting</strong>
              <span id="connection-status" class="connection-status" data-state="connecting">正在连接</span>
            </div>
            <span id="group-meta" class="group-meta"></span>
          </div>
        </header>
        <div id="group-empty" class="pane-empty">
          <p class="empty-hint">从左侧选择一个群</p>
        </div>
        <section id="group-view" class="group-view" hidden>
          <div id="timeline" class="timeline" aria-live="polite"></div>
          <div id="approval-list" class="approval-list"></div>
          <form id="composer" class="composer">
            <div id="attachment-list" class="attachment-list" hidden></div>
            <input id="file-input" type="file" multiple hidden>
            <textarea id="message-input" rows="1" placeholder="发给群里的消息" aria-label="消息"></textarea>
            <div class="composer-row">
              <div class="menu-anchor">
                <button id="plus-button" class="small plus-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="更多操作">+</button>
                <div id="plus-menu" class="popover plus-menu" hidden></div>
              </div>
              <div id="call-picks" class="call-picks" role="group" aria-label="点名"></div>
              <div id="agent-panel" class="popover agent-panel" hidden></div>
              <button id="task-button" class="primary task-button" type="submit" data-action="send" aria-label="发送" title="发送">
                <svg class="task-send-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M8 3 4 7M8 3l4 4"/></svg>
                <span class="task-stop-icon" aria-hidden="true"></span>
              </button>
            </div>
            <p id="composer-status" class="form-status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <div class="settings-body">
        <div class="settings-heading">
          <h2>设置</h2>
          <button id="settings-close-button" class="quiet small" type="button">关闭</button>
        </div>
        <form id="username-form" class="username-form">
          <label for="username-input">用户名</label>
          <div class="username-row">
            <input id="username-input" type="text" autocomplete="off" spellcheck="false">
            <button id="username-save-button" type="submit">保存</button>
          </div>
          <p class="member-note">只影响以后新开的群。英文字母和数字，1～16 位，不能与任一 AI 名字相同（不区分大小写）。</p>
          <p id="username-status" class="form-status" aria-live="polite"></p>
        </form>
        <section class="settings-agents" aria-labelledby="settings-agents-title">
          <div class="settings-agents-heading">
            <h3 id="settings-agents-title">AI</h3>
            <div class="settings-agent-actions" role="group" aria-label="AI 列表操作">
              <button id="settings-add-button" class="small" type="button">添加</button>
              <button id="settings-remove-button" class="small danger" type="button">删除</button>
              <button id="settings-up-button" class="small" type="button" aria-label="上移选中的 AI">↑</button>
              <button id="settings-down-button" class="small" type="button" aria-label="下移选中的 AI">↓</button>
            </div>
          </div>
          <div id="settings-agent-list" class="settings-agent-list"></div>
        </section>
        <p class="member-note">切换 CLI 会清空这个 AI 的默认设置。</p>
        <p class="member-note">群里的 AI 身份（名字、CLI、颜色）在建群时确定，之后修改设置不影响已有的群。</p>
        <p id="settings-status" class="form-status" aria-live="polite"></p>
      </div>
    </dialog>

    <dialog id="rename-dialog" class="rename-dialog">
      <form id="rename-form" method="dialog">
        <h2>重命名</h2>
        <input id="rename-input" type="text" maxlength="100" aria-label="群名" required>
        <p id="rename-status" class="form-status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="rename-cancel-button" type="button">取消</button>
          <button id="rename-save-button" class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="/boot.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
